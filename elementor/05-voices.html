<!-- RIO · 05 TESTIMONIALS -->
<div class="rjj rjj-band rjj-band--paper">
<style>
.rjj-vo{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--rjj-space-6);margin-top:var(--rjj-space-8)}
.rjj-vo__c{margin:0;border-top:1px solid var(--rjj-ink-900);padding-top:var(--rjj-space-5)}
.rjj-vo__q{font:var(--rjj-weight-light) var(--rjj-text-lg)/1.55 var(--rjj-font-display);color:var(--rjj-moss-500);margin:0;letter-spacing:0}
.rjj-vo__n{display:block;margin-top:var(--rjj-space-5);font:var(--rjj-weight-medium) var(--rjj-text-sm)/1.4 var(--rjj-font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--rjj-text-strong)}
.rjj-vo__m{display:block;margin-top:4px;font:var(--rjj-type-body-sm);font-size:var(--rjj-text-xs);letter-spacing:0;text-transform:none;color:var(--rjj-text-muted)}
@media (max-width:860px){ .rjj-vo{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .rjj-vo{grid-template-columns:1fr} }
</style>
  <div class="rjj-wrap">
    <h2 class="rjj-h2">Adults who started where you are</h2>
    <div class="rjj-rule"></div>
    <div class="rjj-vo">
      <figure class="rjj-vo__c">
        <blockquote class="rjj-vo__q">I put it off for two years because I thought I had to get fit first. Six months in, the training is the fitness. I stopped needing the excuse.</blockquote>
        <figcaption class="rjj-vo__n">Marcus D.<span class="rjj-vo__m">Blue belt · training 14 months</span></figcaption>
      </figure>
      <figure class="rjj-vo__c">
        <blockquote class="rjj-vo__q">Nobody tried to smash me on my first night. The upper belts slowed everything down until I understood it. That is why I came back.</blockquote>
        <figcaption class="rjj-vo__n">Kevin A.<span class="rjj-vo__m">White belt · training 5 months</span></figcaption>
      </figure>
      <figure class="rjj-vo__c">
        <blockquote class="rjj-vo__q">I came in with four years of experience from another city and they put me straight into the right room. No ego about where I learned it.</blockquote>
        <figcaption class="rjj-vo__n">Tobias R.<span class="rjj-vo__m">Purple belt · training 6 years</span></figcaption>
      </figure>
    </div>
  </div>
</div>
